name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install ruff black
          pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check driver/ scripts/ tests/ launcher/
      - name: Format check
        run: |
          black --check driver/ scripts/ tests/ launcher/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Download fonts
        run: |
          python fonts/download_fonts.py --platform linux
      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=driver --cov-report=xml --ignore=tests/test_stealth.py
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.11'

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Download GeoIP
        run: |
          bash scripts/download_geoip.sh
      - name: Run integration tests
        run: |
          pytest tests/test_consistency.py -v
        continue-on-error: true  # Don't fail CI on detection site flakiness
