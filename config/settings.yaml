# ═══════════════════════════════════════════════════════════
# Jbium — Global Settings
# ═══════════════════════════════════════════════════════════

# Browser binary
browser:
  # Leave empty to auto-detect (driver/platform_detect.py searches the
  # build output dir and common install locations for the current OS).
  binary_path: ""
  headless: false
  # Linux, headed only: run each session on its own Xvfb sized to the
  # device profile's screen (and force its device pixel ratio), so
  # screen.width/height/devicePixelRatio match the profile instead of the
  # host display (e.g. Xvfb's 1280x1024 default). Needs the `xvfb`
  # package; falls back to the inherited DISPLAY with a warning if absent.
  # Set false to use the existing DISPLAY as-is.
  virtual_display: true
  window_size: "--start-maximized"
  extra_args:
    - "--no-first-run"
    - "--no-default-browser-check"
    - "--disable-background-timer-throttling"
    - "--disable-backgrounding-occluded-windows"
    - "--disable-renderer-backgrounding"
    - "--disable-background-networking"
    - "--disable-client-side-phishing-detection"
    - "--disable-default-apps"
    - "--disable-extensions"
    - "--disable-features=site-per-process,Translate"
    - "--disable-hang-monitor"
    - "--disable-popup-blocking"
    - "--disable-prompt-on-repost"
    - "--disable-sync"
    - "--metrics-recording-only"
    - "--no-pings"
    - "--password-store=basic"
    - "--use-mock-keychain"

# Proxy
proxy:
  # Webshare configuration
  # Set real values via STEALTH_WEBSHARE_USERNAME / STEALTH_WEBSHARE_PASSWORD
  # env vars — never commit real credentials to this file.
  provider: "webshare"
  endpoint: "p.webshare.io"
  port: 80
  username_prefix: ""
  password: ""
  rotation_mode: "numbered"  # "numbered" (1-100) or "rotating"
  min_requests_per_ip: 3
  max_requests_per_ip: 50
  request_delay_seconds: 2.0
  retry_on_407: true
  retry_max: 3

# Fingerprint
fingerprint:
  # When true, generates a new fingerprint for each session
  per_session: true
  # When true, matches device profile to GeoIP OS distribution
  match_geoip: true
  # Canvas/WebGL noise (0.0 = off, 1.0 = aggressive)
  noise_level: 0.5
  # GPU profile override (index into config/fingerprints.json)
  # Set to null for automatic selection
  gpu_profile_override: null

# GeoIP
geoip:
  enabled: true
  database_path: "./data/geoip/GeoLite2-City.mmdb"
  # Optional -- a separate free download from the same MaxMind account.
  # Without it, GeoProfile.asn/isp stay "Unknown" and ip_type stays
  # RESIDENTIAL for every IP, since the City database above carries no
  # ASN/ISP data of its own.
  asn_database_path: "./data/geoip/GeoLite2-ASN.mmdb"
  # Fallback if GeoIP fails
  fallback_country: "US"
  fallback_timezone: "America/New_York"
  fallback_language: "en-US"

# Anti-detection
anti_detection:
  # WebRTC IP leak prevention
  filter_webrtc: true
  # Battery API spoofing -- INERT since 2026-10-06: the driver
  # deliberately no longer sets STEALTH_BATTERY_* (patch 010 returns
  # its hardcoded 1800/14400 constants regardless of charging state,
  # a Battery Status spec violation -- one-line bot check). Unset,
  # the real battery-less-server readings (desktop-AC profile) pass
  # through spec-consistently. Nothing reads this flag.
  spoof_battery: false
  # Canvas noise
  canvas_noise: true
  # WebGL spoofing
  webgl_spoof: true
  # Font filtering
  font_filter: true
  # Plugin consistency
  plugin_consistency: true
  # Navigator spoofing
  navigator_spoof: true
  # User-Agent Client Hints
  ua_client_hints: true

# Testing
testing:
  detection_sites:
    - "https://bot.sannysoft.com/"
    - "https://arh.antoinevastel.com/bots/areyouheadless"
    - "https://fingerprintjs.github.io/fingerprintjs/"
    - "https://browserleaks.com/javascript"
    - "https://browserleaks.com/canvas"
    - "https://browserleaks.com/webgl"
    - "https://browserleaks.com/fonts"
    - "https://tls.peet.ws/"
    - "https://ja3er.com/"
  timeout: 30
  screenshot_dir: "./test_results/screenshots"
  log_file: "./test_results/results.json"

# S3
s3:
  enabled: false
  bucket: ""
  prefix: "jbium"
  region: "us-east-1"
